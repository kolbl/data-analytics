# Pre-commit, tests, and security (pip-audit, bandit) run in parallel. The
# package job builds this project and publishes it to a local pypiserver, then
# installs it from that index. MkDocs is built and deployed to GitHub Pages on
# pushes to main, after those jobs succeed.
#
# Pages: Settings → Pages → Source: GitHub Actions.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Run tests in parallel
        run: uv run pytest -n auto

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: pip audit (installed environment)
        run: uv run pip-audit --ignore-editable --skip-editable || true
      - name: bandit (src/data_analytics)
        run: uv run bandit -r src/data_analytics -f txt

  publish:
    needs: [pre-commit, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Start local package index
        run: |
          mkdir -p packages
          uvx --from "pypiserver[passlib]" pypi-server run \
            -i 127.0.0.1 -p 8080 -P htpasswd -a update --disable-fallback packages &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then
              exit 0
            fi
            sleep 1
          done
          echo "pypiserver did not start" >&2
          exit 1
      - name: Build distributions
        run: uv build
      - name: Publish to the local index
        env:
          UV_PUBLISH_USERNAME: attendee
          UV_PUBLISH_PASSWORD: workshop
        run: uv publish --index local
      - name: Install from the local index
        run: |
          mkdir -p "$RUNNER_TEMP/use-data-analytics"
          cd "$RUNNER_TEMP/use-data-analytics"
          uv init --vcs none
          uv add data-analytics --index http://127.0.0.1:8080/simple/
          uv run python -c "import pandas as pd; from data_analytics.column_statistics import calculate_min_of_column; df = pd.DataFrame({'x': [1.0, 5.0, 3.0]}); print(calculate_min_of_column(df, 'x'))"

  docs-build:
    needs: [pre-commit, test, security, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Build MkDocs site
        run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  docs-deploy:
    needs: [docs-build]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
